# =============================================
#  Lost & Found Management System - Configuration
# =============================================

# --- Server ---
server.port=8080

# --- MongoDB ---
spring.data.mongodb.uri=mongodb://localhost:27017/lostfound_db

# --- JWT ---
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!
jwt.expiration=86400000

# --- File Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# --- Matching ---
matching.similarity-threshold=0.6
